name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  publish:
    uses: TechTeaStudio/.github/.github/workflows/nuget-publish-reusable.yml@main
    with:
      solution: Serilog.TeachTeaStudio.Wrap.sln
      projects_glob: LoggerLibrary/*.csproj
      skip_tests: true
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
